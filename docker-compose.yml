version: '3.8'

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: blog_surrealdb
    restart: always
    command:
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - password
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/database
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    networks:
      - blog_network

  redis:
    image: redis:latest
    container_name: blog_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server
    networks:
      - blog_network

volumes:
  surrealdb_data:
  redis_data:

networks:
  blog_network:
    driver: bridge
