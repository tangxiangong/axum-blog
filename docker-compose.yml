version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: blog_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./blog.sql:/docker-entrypoint-initdb.d/blog.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - blog_network

  redis:
    image: redis:latest
    container_name: blog_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server
    networks:
      - blog_network

volumes:
  mysql_data:
  redis_data:

networks:
  blog_network:
    driver: bridge