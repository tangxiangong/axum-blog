[package]
name = "deepseek"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.12", features = [
    "json",
    "rustls-tls",
    "multipart",
    "cookies",
] }
derive_builder = { version = "0.20.2", features = ["clippy"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "fs", "rt-multi-thread"] }
