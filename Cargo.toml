[workspace]
resolver = "2"
members = [
    "api",
    "app",
    "common",
    "database",
    "migration",
    "service",
    "setting",
]

[profile.dev.package.rsa]
opt-level = 3

[workspace.package]
authors = ["xiangong tang <tangxiangong@gmail.com>"]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
axum-extra = { version = "0", features = ["typed-header", "cookie"] }
axum = { version = "0.8", features = ["form", "macros", "multipart"] }
chrono = { version = "0.4.39", features = ["serde"] }
config = { version = "0.15.6", features = ["yaml"] }
dotenvy = "0.15.7"
idgenerator-thin = "0.2.1"
jsonwebtoken = "9.3.0"
rand = "0.8.5"
regex = "1.11.1"
rsa = { version = "0.9", features = ["pem", "std"] }
sea-orm = { version = "1.1.4", features = [
    "sqlx-mysql",
    "runtime-tokio-rustls",
] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "cors", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.12", features = ["v4", "fast-rng"] }
redis = { version = "0.28.1", features = [
    "tls-rustls-webpki-roots",
    "tls-rustls-insecure",
    "tokio-comp",
    "tokio-rustls-comp",
] }
redis-macros = "0.5.0"
bb8 = "0.9"
bb8-redis = "0.20"
rustls = { version = "0.23", features = ["ring"] }
infer = "0.16.0"
