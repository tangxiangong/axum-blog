[package]
name = "server"
authors = ["xiangong tang <tangxiangong@gmail.com>"]
edition = "2024"
version = "0.1.0"
publish = false

[lib]
name = "server"

[dependencies]
axum = { version = "0.8", features = ["form", "macros", "multipart"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie"] }
bb8 = "0.9"
bb8-redis = "0.24"
chrono = { version = "0.4.39", features = ["serde"] }
config = { version = "0.15.6", features = ["yaml"] }
dotenvy = "0.15.7"
infer = "0.19"
#idgenerator-thin = "0.2.1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.8"
redis = { version = "0.32", features = [
    "tls-rustls-webpki-roots",
    "tls-rustls-insecure",
    "tokio-comp",
    "tokio-rustls-comp",
] }
redis-macros = "0.5"
regex = "1.12"
rsa = { version = "0.9", features = ["pem", "std"] }
rustls = "0.23"
sea-orm = { version = "1.1.4", features = [
    "sqlx-mysql",
    "runtime-tokio-rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "fs", "rt-multi-thread"] }
tower = "0.5.2"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[profile.dev.package.rsa]
opt-level = 3
