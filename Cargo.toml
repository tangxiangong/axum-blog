[package]
name = "server"
authors = ["xiangong tang <tangxiangong@gmail.com>"]
edition = "2024"
version = "0.1.0"
publish = false

[lib]
name = "server"

[dependencies]
axum = { version = "0.8", features = ["form", "macros", "multipart"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie"] }
chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.15", features = ["yaml"] }
infer = "0.19"
jsonwebtoken = { version = "10", default-features = false, features = [
    "rust_crypto",
] }
rand = "0.8"
redis = { version = "1.1", features = [
    "tls-rustls-webpki-roots",
    "tls-rustls-insecure",
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
] }
redis-macros = "1.0"
regex = "1.12"
rsa = { version = "0.9", features = ["pem", "std"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = "3.0"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "fs", "rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[profile.dev.package.rsa]
opt-level = 3
